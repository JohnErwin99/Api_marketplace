<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!--
    IRISTEL PARTNER PORTAL — SIGN-UP PAGE (complete Webflow embed, /sign-up)

    What it does on submit (all in ONE gateway call, POST /portal/signup):
      1. Checks the details first (country, province, Canadian postal code,
         phone format), then blocks emails that are staff or already have a
         MIND account (exact email match) — both are told to log in.
      2. Creates the MIND billing account (POST /accounts). The key used is
         chosen by the account type, because it sets the providerCode:
           reseller / white-label -> RESELL key
           everything else        -> agent-side key
         If MIND rejects the details, NOTHING has been created.
      3. Only then creates the login (auth0 unified/sign-up). If a login
         already existed, the user gets a password reset email instead.
      4. Mirrors the new customer into Dynamics 365 and completes the session
         like the login page: same cookies, marketplaceAccess, redirect.
  -->

  <style>
    .container {
      width: 430px;
      background: #fff;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      animation: fadeIn 0.6s ease;
      text-align: center;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h2 { font-weight: 600; margin-bottom: 4px; color: #333; }
    #subtitle { font-size: 13px; color: #888; margin-bottom: 20px; }
    label {
      text-align: left; display: block; margin-top: 13px;
      font-weight: 500; color: #333; font-size: 14px;
    }
    input, select {
      width: 100%; padding: 11px; margin-top: 5px; border-radius: 8px;
      border: 1px solid #ccc; font-size: 15px; box-sizing: border-box;
      background: #fff;
    }
    .two-col { display: flex; gap: 10px; }
    .two-col > div { flex: 1; }
    .radio-row {
      display: flex; gap: 18px; margin-top: 6px; text-align: left;
    }
    .radio-row label {
      display: flex; align-items: center; gap: 7px; margin: 0;
      font-weight: 500; cursor: pointer;
    }
    .radio-row input { width: auto; margin: 0; }
    .type-list { display: grid; gap: 8px; margin-top: 6px; text-align: left; }
    .type-list label { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; font-size: 13px; line-height: 1.4; border: 1px solid #e3e8ef; border-radius: 8px; padding: 10px 12px; cursor: pointer; }
    .type-list input { width: auto; margin: 3px 0 0; }
    .radio-hint { text-align: left; font-size: 12px; color: #888; margin-top: 4px; }
    button {
      width: 100%; padding: 14px; margin-top: 22px; border: none;
      border-radius: 8px; background: #D1155A; color: #fff; font-size: 17px;
      font-weight: 600; cursor: pointer; transition: 0.3s;
    }
    button:hover { background: #3d41a6; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .back-link {
      display: inline-block; margin-top: 16px; font-size: 13px;
      color: #888; text-decoration: none; cursor: pointer;
    }
    .back-link:hover { text-decoration: underline; }
    #message {
      margin-top: 15px; font-weight: 600; color: #333;
      min-height: 22px; font-size: 14px;
    }
    #message a { color: #D1155A; }
    [hidden] { display: none !important; }
    .reg-status { font-size: 13px; margin: -6px 0 12px; font-weight: 600; }
    .reg-status.ok { color: #11733d; } .reg-status.review { color: #9a6400; } .reg-status.bad { color: #b42318; }
    .type-chip { padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
    .type-chip button { background: none; border: 0; padding: 0; color: #D1155A; font: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; width: auto; margin: 0; }
    .type-note { font-size: 12.5px; color: #666; margin: 4px 0 14px; }
    .type-note a { color: #D1155A; }
  </style>

  <script>
    // ── MARKETPLACE ────────────────────────────────────────────
    const MARKETPLACE_GATEWAY = "https://api-marketplace-1im9.onrender.com";
    // Businesses and partners must give a registration number, checked live
    // against the registries (gateway lib/registration.js) and again by the
    // gateway before anything is created. The document stays optional here.
    const REQUIRE_REGISTRATION = true;

    // ?type=business|partner|agent preselects the account type (links from
    // the API marketplace page) and hides the choice.
    const SIGNUP_PARAMS = new URLSearchParams(location.search);
    const LEGACY_TYPES = { customer: 'business', consumer: 'business', reseller: 'partner', 'white-label': 'partner' };
    const TYPE_LABELS = { business: 'Business customer', partner: 'Iristel partner', agent: 'Agent' };
    const presetType = (function (t) { t = LEGACY_TYPES[t] || t; return TYPE_LABELS[t] ? t : null; })(String(SIGNUP_PARAMS.get('type') || '').toLowerCase());
    // This page is only for signing up to the API Marketplace: every sign-up
    // is a marketplace sign-up and gets the marketplace-only portal.
    const FROM_MARKETPLACE = true;

    // Same clear-cookies-on-load as the login page.
    ['userEmail','agentId','agentIds','partnerType','code','name',
     'lastCourseId','startActivationDate','marketplaceAccess'].forEach(function (k) {
      document.cookie = k + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
    });

    document.addEventListener('DOMContentLoaded', () => {

      // No API keys in this page: every IristelX call goes through the
      // marketplace gateway (/portal/*), which holds the keys.

      // Account type -> partnerType cookie value the portal nav understands.
      const PARTNER_TYPE_COOKIE = { business: 'customer', partner: 'reseller', agent: 'agent' };

      // Canadian postal codes: MIND only accepts "A1A 1A1" / "A1A1A1". Returns
      // the code formatted as "A1A 1A1", or null when it isn't valid. Other
      // countries pass through trimmed.
      const normalizeCountry = (c) => {
        const v = String(c || '').trim().toUpperCase();
        return ({ CANADA: 'CA', 'UNITED STATES': 'US', ROMANIA: 'RO', KENYA: 'KE' })[v] || v;
      };
      const normalizePostal = (pc, country) => {
        if (normalizeCountry(country) !== 'CA') return String(pc || '').trim();
        const v = String(pc || '').toUpperCase().replace(/\s+/g, '');
        return /^[A-Z]\d[A-Z]\d[A-Z]\d$/.test(v) ? v.slice(0, 3) + ' ' + v.slice(3) : null;
      };

      const isInternalDomain = (email) =>
        /@(iristel|telehop)\.com$/i.test(String(email || '').trim());

      // ── API helpers ─────────────────────────────────────────────
      const sendResetEmail = async (email) => {
        try {
          const response = await fetch(MARKETPLACE_GATEWAY + "/portal/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email })
          });
          const data = await response.json().catch(() => ({}));
          return { ok: !!(response.ok && data.success) };
        } catch (e) { return { ok: false }; }
      };

      const setCookie = (name, value, days) => {
        let expires = "";
        if (days) {
          const date = new Date();
          date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
          expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + encodeURIComponent(value) + expires + "; path=/; SameSite=Strict";
      };

      // ── MARKETPLACE ─────────────────────────────────────────────
      // Signed gateway session (same as the login page): proves the new
      // password, and is required by the access lookup below.
      const setMarketplaceSessionCookie = async (email, password) => {
        try {
          const response = await fetch(MARKETPLACE_GATEWAY + "/marketplace/session", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email, password: password })
          });
          if (!response.ok) return null;
          const data = await response.json();
          if (data.token) setCookie('marketplaceSession', data.token, 1);
          return data.token || null;
        } catch (e) { return null; }
      };

      const setMarketplaceAccessCookie = async (email, session) => {
        try {
          if (!session) return;
          const response = await fetch(
            MARKETPLACE_GATEWAY + "/marketplace/authorizations?email=" + encodeURIComponent(email),
            { headers: { "Authorization": "Bearer " + session } });
          if (!response.ok) return;
          const data = await response.json();
          const ids = (data.products || []).join(",");
          if (ids) setCookie('marketplaceAccess', ids, 7);
          // People who came for the API marketplace get a nav focused on it.
          setCookie('marketplaceOnly', data.marketplaceOnly ? '1' : '', 7);
          return data;
        } catch (e) { /* marketplace stays hidden */ }
      };

      const startCountdown = (seconds) => {
        let counter = seconds;
        const message = document.getElementById('message');
        const interval = setInterval(() => {
          if (counter > 0) {
            message.textContent = `Redirecting in ${counter} seconds...`;
          } else {
            clearInterval(interval);
            window.location.href = FROM_MARKETPLACE ? "/api-marketplace" : "/home";
          }
          counter--;
        }, 1000);
        return interval;
      };

      // Completes the session exactly like the login page's completeLogin.
      const completeSignupLogin = async (fields, created, accountType, password) => {
        setCookie('userEmail', fields.email, 7);
        const name = [fields.fname, fields.lname].filter(Boolean).join(' ')
          || String(fields.email).split('@')[0] || 'Partner';
        setCookie('name', name, 7);
        // The type chosen on this form, in the portal nav's vocabulary.
        setCookie('partnerType', PARTNER_TYPE_COOKIE[accountType] || 'customer', 7);
        // Marketplace sign-ups see only the API Marketplace in the portal.
        setCookie('marketplaceOnly', '1', 7);
        if (created && created.id) {
          setCookie('agentId',  created.id, 7);
          setCookie('agentIds', String(created.id), 7);
        }
        setCookie('code', (created && created.accountId) || '', 7);

        const session = await setMarketplaceSessionCookie(fields.email, password);
        await setMarketplaceAccessCookie(fields.email, session);

        document.getElementById('message').textContent = 'Account created! Redirecting...';
        startCountdown(5);
      };

      const typeNow = () => ((document.querySelector('input[name="accountType"]:checked') || {}).value) || 'business';

      // Preselected type: show it as a chip and hide the list ("Change"
      // brings it back).
      if (presetType) {
        const radio = document.querySelector('input[name="accountType"][value="' + presetType + '"]');
        if (radio) radio.checked = true;
        document.getElementById('typeList').hidden = true;
        const chip = document.getElementById('typeChip');
        chip.hidden = false;
        chip.querySelector('strong').textContent = TYPE_LABELS[presetType];
        chip.querySelector('button').addEventListener('click', function () {
          chip.hidden = true; document.getElementById('typeList').hidden = false;
        });
      }
      if (FROM_MARKETPLACE) document.getElementById('subtitle').textContent =
        'Sign up for the Iristel API Marketplace — your login also opens the Iristel Partner Portal';

      // Every account type here (business customer, partner, agent) gives a
      // business registration number.
      document.getElementById('businessRegNumber').required = REQUIRE_REGISTRATION;
      document.getElementById('businessName').placeholder = 'Your registered business name';

      // Live registration check against the official registries.
      const REG_HINT = { CA: 'CRA Business Number, e.g. 123456789', US: 'EIN, e.g. 12-3456789', RO: 'CUI / CIF, e.g. RO14399840', KE: 'KRA PIN, e.g. P051234567X' };
      const regInput = document.getElementById('businessRegNumber');
      const regOut = document.getElementById('regStatus');
      let regResult = null, regTimer = null;
      const checkRegistration = async () => {
        const number = regInput.value.trim();
        regResult = null;
        if (!number) { regOut.textContent = ''; regOut.className = 'reg-status'; return null; }
        regOut.textContent = 'Checking…'; regOut.className = 'reg-status';
        try {
          const r = await fetch(MARKETPLACE_GATEWAY + '/portal/verify-registration', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ country: normalizeCountry(document.getElementById('country').value), number: number, name: document.getElementById('businessName').value.trim() })
          });
          regResult = await r.json();
        } catch (e) { regOut.textContent = ''; return null; }
        regOut.className = 'reg-status ' + (regResult.status === 'verified' ? 'ok' : regResult.status === 'invalid' ? 'bad' : 'review');
        regOut.textContent = regResult.status === 'verified'
          ? '✓ Verified' + (regResult.legalName ? ': ' + regResult.legalName : '')
          : (regResult.status === 'invalid' ? '⚠ ' : '') + (regResult.reason || '');
        return regResult;
      };
      regInput.addEventListener('input', function () { clearTimeout(regTimer); regTimer = setTimeout(checkRegistration, 700); });
      const countrySel = document.getElementById('country');
      const syncCountry = () => {
        const c = countrySel.value;
        regInput.placeholder = REG_HINT[c] || '';
        const prov = document.getElementById('province');
        document.getElementById('provinceLabel').textContent = c === 'CA' ? 'Province' : c === 'US' ? 'State' : 'County';
        prov.placeholder = c === 'CA' ? 'ON' : c === 'US' ? 'NY' : '';
        if (regInput.value.trim()) checkRegistration();
      };
      countrySel.addEventListener('change', syncCountry);
      syncCountry();

      // ── Submit ──────────────────────────────────────────────────
      const message = document.getElementById('message');
      const submitBtn = document.getElementById('submitBtn');
      const val = (id) => (document.getElementById(id).value || '').trim();

      document.getElementById('signupForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        const fields = {
          fname: val('fname'), lname: val('lname'),
          businessName: val('businessName'),
          email: val('email').toLowerCase(), phone: val('phone'),
          address1: val('address1'), city: val('city'),
          province: val('province'), postalCode: val('postalCode'),
          country: val('country')
        };
        fields.businessRegNumber = val('businessRegNumber');
        const accountType = typeNow();
        const password = document.getElementById('password').value;
        const confirm  = document.getElementById('passwordConfirm').value;

        if (password !== confirm) { message.textContent = 'Passwords do not match.'; return; }
        if (password.length < 8) { message.textContent = 'Password must be at least 8 characters.'; return; }
        // Check the address MIND will validate BEFORE anything is created, so
        // a typo can't leave a login without a billing account.
        fields.country = normalizeCountry(fields.country);
        fields.province = fields.province.toUpperCase();
        const postal = normalizePostal(fields.postalCode, fields.country);
        if (postal === null) { message.textContent = 'Postal code should look like A1A 1A1.'; return; }
        fields.postalCode = postal;
        if (!fields.businessRegNumber && REQUIRE_REGISTRATION) { message.textContent = 'Business registration number is required.'; return; }
        if (fields.businessRegNumber) {
          const reg = regResult || await checkRegistration();
          if (reg && reg.status === 'invalid') { message.textContent = reg.reason || 'Check your business registration number.'; return; }
        }

        // Business registration document (fraud screening) -> base64, <= 5 MB.
        const regFile = document.getElementById('registrationFile').files[0];
        if (regFile && regFile.size > 5 * 1024 * 1024) { message.textContent = 'Document must be 5 MB or smaller.'; return; }
        const registrationDocument = !regFile ? null : await new Promise(function (resolve) {
          const r = new FileReader();
          r.onload = function () { resolve({ name: regFile.name, type: regFile.type, dataB64: String(r.result).split(',')[1] || '' }); };
          r.onerror = function () { resolve(null); };
          r.readAsDataURL(regFile);
        });
        if (regFile && !registrationDocument) { message.textContent = 'Could not read the document — try another file.'; return; }

        submitBtn.disabled = true;

        // Staff never sign up here.
        if (isInternalDomain(fields.email)) {
          message.innerHTML = 'Iristel / Telehop staff don\'t sign up here — use ' +
            '<a href="/login">the login page</a> ("First time logging in?").';
          submitBtn.disabled = false;
          return;
        }

        // 1–3. One gateway call does the whole sign-up in the safe order:
        // validate everything, create the MIND billing account, and only then
        // create the login. If anything is rejected, nothing is created.
        message.textContent = 'Creating your account...';
        let created = null, status = 0;
        try {
          const response = await fetch(MARKETPLACE_GATEWAY + "/portal/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              accountType: accountType,
              businessRegNumber: fields.businessRegNumber,
              email: fields.email,
              password: password,
              account: {
                name: fields.businessName || (fields.fname + ' ' + fields.lname),
                language: "EN",
                contact: {
                  fname: fields.fname, lname: fields.lname,
                  address1: fields.address1, city: fields.city,
                  province: fields.province, country: fields.country,
                  postalCode: fields.postalCode, emailAddress: fields.email,
                  // MIND wants the phone as an object, not a string.
                  phone: fields.phone ? { mobile: fields.phone } : undefined
                }
              }
            })
          });
          status = response.status;
          created = await response.json().catch(() => ({}));
        } catch (e) {
          created = { error: 'Could not reach the sign-up service. Nothing was created — try again.' };
        }
        if (status === 409 && created.error === 'employee') {
          message.innerHTML = 'This email is registered as an employee — <a href="/login">log in instead</a>.';
          submitBtn.disabled = false;
          return;
        }
        if (status === 409 && created.error === 'exists') {
          message.innerHTML = 'You already have an account (' +
            (created.name ? String(created.name).replace(/</g, '&lt;') : 'account ' + created.accountId) +
            ') — <a href="/login">log in instead</a>.';
          submitBtn.disabled = false;
          return;
        }
        if (!created || !created.accountId) {
          // Nothing was created: fix the data and submit again.
          message.textContent = (created && created.error) || 'Sign-up failed. Nothing was created — try again.';
          submitBtn.disabled = false;
          return;
        }

        // 4. Mirror the new customer into Dynamics 365 (account + primary
        // contact + MIND account code) so the relationship is on record from
        // day one. Awaited (the page navigates away next, which would cancel
        // the upload of the registration document) but capped at 15 s, and
        // CRM being down never blocks sign-up.
        message.textContent = 'Finishing your account setup...';
        const crmAbort = new AbortController();
        const crmTimer = setTimeout(function () { crmAbort.abort(); }, 15000);
        await fetch(MARKETPLACE_GATEWAY + '/marketplace/signup', {
          method: 'POST',
          signal: crmAbort.signal,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: fields.email, fname: fields.fname, lname: fields.lname,
            businessName: fields.businessName, phone: fields.phone,
            businessRegNumber: fields.businessRegNumber,
            registrationDocument: registrationDocument,
            address1: fields.address1, city: fields.city, province: fields.province,
            postalCode: fields.postalCode, country: fields.country,
            accountType: accountType, mindAccountId: created.accountId,
            from: 'marketplace'
          })
        }).then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (d) {
            console.log('CRM sign-up mirror:', r.status, d);
            if (d.contactError) console.warn('CRM contact not linked:', d.contactError);
          });
        }).catch(function (e) {
          console.warn('CRM sign-up mirror failed:', e);
        }).finally(function () { clearTimeout(crmTimer); });

        // The billing account exists; the login already did (or could not be made).
        if (created.loginExists) {
          const reset = await sendResetEmail(fields.email);
          message.innerHTML = 'Your account is set up. You already had login credentials' +
            (reset.ok ? ' — we\'ve emailed you a password reset link.' : '.') + ' <a href="/login">Log in</a>.';
          return;
        }
        if (!created.loginCreated) {
          message.textContent = created.error || 'Your billing account was created, but your login could not be. Contact support to finish activation.';
          return;
        }

        // 5. Same session completion as the login page.
        await completeSignupLogin(fields, created, accountType, password);
      });
    });
  </script>
</head>

<body>

  <div class="container">
    <div style="text-align:center;">
      <img
        src="https://cdn.prod.website-files.com/67ae3dc9346b175361116c60/693b2919992dfa59c54be930_Untitled%20design.png"
        alt="Logo"
        style="width:220px; margin-bottom:15px;"
      />
    </div>
    <h2>Create your account</h2>
    <div id="subtitle">Sign up for the Iristel Partner Portal</div>

    <form id="signupForm">
      <label>Account type</label>
      <div class="type-chip" id="typeChip" hidden>Signing up as <strong></strong> · <button type="button">Change</button></div>
      <div class="type-list" id="typeList">
        <label><input type="radio" name="accountType" value="business" checked>
          <span><strong>Business customer</strong> — my business uses Iristel services (calling, SIP trunks, numbers, Teams/Webex, SMS, 911) for itself.</span></label>
        <label><input type="radio" name="accountType" value="partner">
          <span><strong>Iristel partner</strong> — we resell Iristel services and bill our own customers (carriers, ISPs, MSPs, VARs, UCaaS, white-label, co-branded).</span></label>
        <label><input type="radio" name="accountType" value="agent">
          <span><strong>Agent</strong> — I sign customers up for Iristel and earn commission; Iristel handles billing and support.</span></label>
      </div>
      <p class="type-note">Iristel employees don't sign up here — <a href="/login">log in</a> with your Iristel account.</p>

      <div class="two-col">
        <div><label for="fname">First Name</label><input type="text" id="fname" required autocomplete="given-name"></div>
        <div><label for="lname">Last Name</label><input type="text" id="lname" required autocomplete="family-name"></div>
      </div>

      <label for="businessName">Business Name</label>
      <input type="text" id="businessName" autocomplete="organization" placeholder="Optional for individuals">

      <div id="regBlock">
        <label for="businessRegNumber">Business Registration Number</label>
        <input type="text" id="businessRegNumber" placeholder="CRA Business Number, e.g. 123456789">
        <div class="reg-status" id="regStatus" aria-live="polite"></div>

        <label for="registrationFile">Business Registration Document <span style="font-weight:400;color:#777">(optional)</span></label>
        <input type="file" id="registrationFile" accept=".pdf,.png,.jpg,.jpeg">
      </div>

      <label for="email">Email Address</label>
      <input type="email" id="email" required autocomplete="email">

      <label for="phone">Phone</label>
      <input type="tel" id="phone" autocomplete="tel">

      <label for="address1">Address</label>
      <input type="text" id="address1" required autocomplete="address-line1">

      <div class="two-col">
        <div><label for="city">City</label><input type="text" id="city" required autocomplete="address-level2"></div>
        <div><label for="province" id="provinceLabel">Province</label><input type="text" id="province" required placeholder="ON" maxlength="30" autocomplete="address-level1"></div>
      </div>

      <div class="two-col">
        <div><label for="postalCode">Postal Code</label><input type="text" id="postalCode" required autocomplete="postal-code"></div>
        <div><label for="country">Country</label><select id="country" required autocomplete="country"><option value="CA" selected>Canada</option><option value="US">United States</option><option value="RO">Romania</option><option value="KE">Kenya</option></select></div>
      </div>

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="new-password">

      <label for="passwordConfirm">Retype Password</label>
      <input type="password" id="passwordConfirm" required autocomplete="new-password">

      <button type="submit" id="submitBtn">Create Account</button>

      <a href="/login" class="back-link">Already have an account? Log in</a>
    </form>

    <div id="message"></div>
  </div>

</body>
</html>
